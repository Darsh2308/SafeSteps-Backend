app = "safesteps-backend"
primary_region = "bom"   # Mumbai — closest to India

[build]

[http_service]
  internal_port       = 8000
  force_https         = true
  auto_stop_machines  = false   # Never sleep — critical for emergency app
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
